services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aampere
      POSTGRES_USER: aampere
      POSTGRES_PASSWORD: aampere
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aampere -d aampere"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer:5-standalone
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:

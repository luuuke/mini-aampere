services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aampere
      POSTGRES_USER: aampere
      POSTGRES_PASSWORD: aampere
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aampere -d aampere"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  database-init:
    build:
      context: ./backend
      target: database-init
    environment:
      DATABASE_URL: postgresql://aampere:aampere@postgres:5432/aampere?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
      target: production
    environment:
      DATABASE_URL: postgresql://aampere:aampere@postgres:5432/aampere?schema=public
      JWT_SECRET: ${JWT_SECRET:-docker-development-secret-change-before-production}
      JWT_EXPIRES_IN_SECONDS: 3600
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      database-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    init: true

  frontend:
    build:
      context: ./frontend
      target: production
      args:
        API_URL: http://backend:3000
    environment:
      API_URL: http://backend:3000
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      backend:
        condition: service_healthy
    init: true

  adminer:
    image: adminer:5-standalone
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:

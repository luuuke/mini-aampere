services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aampere
      POSTGRES_USER: aampere
      POSTGRES_PASSWORD: aampere
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aampere -d aampere"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
